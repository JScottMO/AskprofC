<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask a Question</title>
<style>
  :root{
    --bg:#fbf8f2; --card:#ffffff; --fg:#1f1d1a; --muted:#6f6a61; --line:#e3ddd2;
    --accent:#b4472b; --accent-fg:#ffffff; --ok:#2f7a4b; --err:#b3261e;
    --paper:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#161513; --card:#1f1e1b; --fg:#ece8e1; --muted:#a29d93; --line:#34312c;
      --accent:#e2795c; --accent-fg:#1a1916; --ok:#6fcf97; --err:#f28b82;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161513; --card:#1f1e1b; --fg:#ece8e1; --muted:#a29d93; --line:#34312c;
    --accent:#e2795c; --accent-fg:#1a1916; --ok:#6fcf97; --err:#f28b82;
  }
  :root[data-theme="transparent"] body{background:transparent}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:560px;margin:0 auto;padding:22px 16px 18px;background:var(--card);
        border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--paper)}
  h1{font:600 21px/1.25 ui-serif,Georgia,"Times New Roman",serif;margin:4px 0 4px}
  .sub{margin:0 0 16px;color:var(--muted);font-size:14px}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
  .opt{font-weight:400;color:var(--muted)}
  textarea,input{width:100%;font:inherit;color:var(--fg);background:var(--bg);
       border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  textarea{resize:vertical;min-height:104px}
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .count{text-align:right;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  button{margin-top:14px;width:100%;font:600 16px/1 inherit;font-family:inherit;padding:13px 16px;
         background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  #msg{min-height:1.4em;margin:12px 0 0;font-size:14px;text-align:center}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--err)}
</style>
</head>
<body>
<main class="card">
  <h1 id="title">Ask Prof C a question</h1>
  <p class="sub" id="subtitle">Your question prints out on a little receipt printer in my workshop.</p>

  <form id="f" novalidate>
    <label for="q">Your question</label>
    <textarea id="q" maxlength="400" required placeholder="What would you like to ask?"></textarea>
    <div class="count" id="count">0 / 400</div>

    <label for="name">Your name <span class="opt">(optional)</span></label>
    <input id="name" maxlength="40" autocomplete="name">

    <div class="hp" aria-hidden="true">
      <label for="website">Leave this empty</label>
      <input id="website" tabindex="-1" autocomplete="off">
    </div>

    <button id="send" type="submit">Send to the printer</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
/* ===== The only line you must edit: your Adafruit IO *raw* webhook URL ===== */
const WEBHOOK_URL = "https://io.adafruit.com/api/v2/webhooks/feed/L9oSndhwFQ9JwqgG5tiS7NAqioNq/raw";

const MAX_PER_VISIT = 5;      // per browser tab session
const COOLDOWN_SECONDS = 15;

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

/* Where is this embed? ?src=yt-workshop  (or standard ?utm_source=&utm_medium=&utm_campaign=) */
const source = (params.get("src") ||
  [params.get("utm_source"), params.get("utm_medium"), params.get("utm_campaign")].filter(Boolean).join("/") ||
  "direct").slice(0, 80);

/* Optional per-page customization */
if (params.get("title")) $("title").textContent = params.get("title");
if (params.get("subtitle")) $("subtitle").textContent = params.get("subtitle");
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");  // light | dark | transparent

let ref = "";
try { ref = document.referrer ? new URL(document.referrer).hostname : ""; } catch (e) {}

function sentCount(add) {
  try {
    const n = Number(sessionStorage.getItem("askprofc-sent") || 0) + (add || 0);
    if (add) sessionStorage.setItem("askprofc-sent", String(n));
    return n;
  } catch (e) { return 0; }
}

function say(text, kind) { $("msg").textContent = text; $("msg").className = kind || ""; }

$("q").addEventListener("input", () => { $("count").textContent = `${$("q").value.length} / 400`; });

$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = $("q").value.trim();
  if (!q) { say("Type a question first.", "err"); $("q").focus(); return; }
  if ($("website").value) { say("Sent! Thanks.", "ok"); $("f").reset(); return; }  // bot trap
  if (sentCount() >= MAX_PER_VISIT) { say("Thanks! That's the limit for one visit.", "err"); return; }

  const payload = { v: 1, q, name: $("name").value.trim(), src: source, ref, ts: new Date().toISOString() };
  let body = JSON.stringify(payload);
  const enc = new TextEncoder();
  while (enc.encode(body).length > 950 && payload.q.length) {      // Adafruit IO values max ~1 KB
    payload.q = payload.q.slice(0, -10);
    body = JSON.stringify(payload);
  }

  $("send").disabled = true;
  say("Sending…");
  try {
    // text/plain + no-cors = a "simple" request the browser sends straight to Adafruit IO
    await fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors",
                               headers: { "Content-Type": "text/plain" }, body });
    sentCount(1);
    $("q").value = ""; $("count").textContent = "0 / 400";
    say("Sent! It's printing in the workshop (or waiting in line).", "ok");
    setTimeout(() => { $("send").disabled = false; }, COOLDOWN_SECONDS * 1000);
  } catch (e) {
    say("Couldn't send — check your connection and try again.", "err");
    $("send").disabled = false;
  }
});
</script>
</body>
</html>
